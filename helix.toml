# Sunlit Sands: hand-shipped Helix theme.
# Omarchy's built-in template generates this file from colors.toml; a copy shipped in the theme folder
# replaces that output, for the author and for anyone who installs the theme. It carries real values in
# [palette], so after a palette change regenerate it (delete this file, `omarchy theme refresh`, copy
# ~/.local/state/omarchy/current/theme/helix.toml back) and re-apply the changes listed here.
#
# Changes from the template:
#   ui.statusline            fg background / bg foreground  ->  fg foreground / bg dark_background  (status bar on the sky blue)
#   ui.statusline.inactive   bg color8                      ->  fg color8 / bg dark_background
#   ui.bufferline            bg background                  ->  bg dark_background  (tab strip on the blue, inactive tabs muted)
#   ui.bufferline.active     underline color5               ->  underline accent    (active tab stays sand, accent underline)
#   ui.window                fg color8                      ->  fg darker_background  (dividers on the recess blue)
#   ui.menu.selected         fg background / bg foreground  ->  fg foreground / bg lighter_background  (selected row on the raised blue)
#   ui.cursorline.primary    bg lighter_background          ->  bg dark_background  (current line on the lightest blue)
#   [palette]                added dark_background, darker_background, accent
# Unchanged on purpose: ui.background transparent (terminal is sand anyway), ui.selection gold,
# ui.text.focus and ui.highlight on lighter_background, line numbers and dimmed text on color8 (= muted).

# Syntax
"keyword" = "color5"
"keyword.control" = { fg = "color5", modifiers = ["italic"] }
"function" = "color4"
"function.builtin" = "color4"
"function.macro" = "color5"
"type" = "color3"
"type.builtin" = "color5"
"type.enum.variant" = "color6"
"constructor" = "color4"
"constant" = "color3"
"constant.builtin" = "color3"
"constant.numeric" = "color3"
"constant.character" = "color6"
"constant.character.escape" = "color5"
"string" = "color2"
"string.regexp" = "color5"
"string.special" = "color4"
"comment" = { fg = "color8", modifiers = ["italic"] }
"variable" = "foreground"
"variable.parameter" = { fg = "color5", modifiers = ["italic"] }
"variable.builtin" = "color1"
"variable.other.member" = "color4"
"label" = "color4"
"punctuation" = "color8"
"punctuation.special" = "color6"
"operator" = "color6"
"tag" = "color4"
"namespace" = { fg = "color3", modifiers = ["italic"] }
"special" = "color5"
"attribute" = "color3"

# Markup
"markup.heading.1" = "color1"
"markup.heading.2" = "color3"
"markup.heading.3" = "color3"
"markup.heading.4" = "color2"
"markup.heading.5" = "color4"
"markup.heading.6" = "color5"
"markup.list" = "color6"
"markup.list.unchecked" = "color8"
"markup.list.checked" = "color2"
"markup.bold" = { fg = "color1", modifiers = ["bold"] }
"markup.italic" = { fg = "color1", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "color4", modifiers = ["italic", "underlined"] }
"markup.link.text" = "color5"
"markup.link.label" = "color4"
"markup.raw" = "color2"
"markup.quote" = "color5"

# Diff
"diff.plus" = "color2"
"diff.minus" = "color1"
"diff.delta" = "color4"

# Leave the editor background transparent so the terminal background shows through
"ui.background" = { }

"ui.linenr" = { fg = "color8" }
"ui.linenr.selected" = { fg = "foreground" }

# Statusline on the panel blue with body-text ink.
"ui.statusline" = { fg = "foreground", bg = "dark_background" }
"ui.statusline.inactive" = { fg = "color8", bg = "dark_background" }
"ui.statusline.normal" = { fg = "background", bg = "color4", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "background", bg = "color2", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "background", bg = "color5", modifiers = ["bold"] }

"ui.popup" = { fg = "foreground", bg = "background" }
"ui.window" = { fg = "darker_background" }
"ui.help" = { fg = "foreground", bg = "background" }

"ui.bufferline" = { fg = "color8", bg = "dark_background" }
"ui.bufferline.active" = { fg = "foreground", bg = "background", underline = { color = "accent", style = "line" } }

"ui.text" = "foreground"
"ui.text.focus" = { fg = "foreground", bg = "lighter_background", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "color8" }
"ui.text.directory" = { fg = "color4" }

"ui.virtual" = "color8"
"ui.virtual.ruler" = { bg = "lighter_background" }
"ui.virtual.indent-guide" = "color8"
"ui.virtual.inlay-hint" = { fg = "color8" }
"ui.virtual.jump-label" = { fg = "color1", modifiers = ["bold"] }
"ui.virtual.whitespace" = "color8"

"ui.selection" = { bg = "selection_background", fg = "selection_foreground" }

"ui.cursor" = { fg = "background", bg = "cursor" }
"ui.cursor.primary" = { fg = "background", bg = "cursor" }
"ui.cursor.match" = { fg = "color3", modifiers = ["bold"] }
"ui.cursor.primary.normal" = { fg = "background", bg = "cursor" }
"ui.cursor.primary.insert" = { fg = "background", bg = "color2" }
"ui.cursor.primary.select" = { fg = "background", bg = "color5" }

"ui.cursorline.primary" = { bg = "dark_background" }

"ui.highlight" = { bg = "lighter_background", modifiers = ["bold"] }

"ui.menu" = { fg = "foreground", bg = "background" }
"ui.menu.selected" = { fg = "foreground", bg = "lighter_background", modifiers = ["bold"] }

"diagnostic.error" = { underline = { color = "color1", style = "curl" } }
"diagnostic.warning" = { underline = { color = "color3", style = "curl" } }
"diagnostic.info" = { underline = { color = "color4", style = "curl" } }
"diagnostic.hint" = { underline = { color = "color6", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

error = "color1"
warning = "color3"
info = "color4"
hint = "color6"

[palette]
background = "#f7f1e3"
foreground = "#2a2f4a"
lighter_background = "#bcd8f5"
dark_background = "#dbe7f2"
darker_background = "#bfd3e6"
accent = "#2a78b0"
cursor = "#2a2f4a"
selection_background = "#f3e2a0"
selection_foreground = "#2a2f4a"
color0 = "#f7f1e3"
color1 = "#c43a2a"
color2 = "#46782b"
color3 = "#8f6600"
color4 = "#2470b0"
color5 = "#8a5a9e"
color6 = "#157682"
color7 = "#2a2f4a"
color8 = "#5d6b7d"
