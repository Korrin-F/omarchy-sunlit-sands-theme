# Sunlit Sands: a light theme built from the wallpapers in backgrounds/.
# Background direction: round 2, option 1e "sunlit sand, own the blue", with the 1g text and selection
# fixes and the 1h raised-surface fix of 2026-09-07 (see sunlit-sands-light-theme.md).
# Contrast ratios in comments are against `background`; text colours clear 4.5:1 (WCAG AA).
# Painter's rule for sunshine: warm light, cool shadow. The main surface is sunlit cream, the raised
# surfaces and panels are the short blue shadows and the sky, the ink is blue-violet.

mode = "light"

# Sky cerulean. Borders and bar highlights read as sky against the cream. 4.2:1, fine for borders and highlights.
accent = "#2a78b0"
# Unfocused window border. Omarchy's Hyprland template reads this key if present and otherwise falls back
# to a stock grey (rgba(595959aa)) that belongs to no theme; set here to `muted` so inactive frames sit in
# the palette. Same visual weight as the stock grey, just the cool shadow tint. (2026-09-07)
hyprland_inactive_border = "#5d6b7d"
# Sun-gold selection: warm on the cool raised surface, so selected text is unmistakable. The earlier
# sky selection (#c4d8ea) measured 1.08:1 against lighter_background, which made it invisible on the
# active line. Body text on this gold is 10:1.
selection = "#f3e2a0"
# Cool shadow grey, darkened on 2026-09-07 from #8e9bab so the roles Zed maps here (file panel names,
# inactive tab labels, line numbers, comments) read on the sky panel: 4.8:1 on background, 4.3:1 on
# dark_background. Also the btop gradient middle. Note: Omarchy's built-in Hyprland template hardcodes
# the inactive window border, so this slot does not reach it.
muted = "#5d6b7d"

# The main surface is warm cream (sunlit sand). The panels, raised surfaces and recesses are a clearly
# intended pale sky blue, stronger than option 1 so it reads as a deliberate sky band, not a grey gone cool,
# deliberately a different tint: that temperature contrast is what reads as sun.
# lighter_background is the raised surface (hover, selection, cards). In a light theme that is a
# shade DARKER than background; lighter than it reads as white.
background = "#f7f1e3"
# Raised surface pushed to a stronger, more saturated sky on 2026-09-07 (1h): the earlier #cfe0ef sat
# 1.07:1 from dark_background, so Zed's selected file row barely showed. Same lightness, more colour,
# so blue text on it loses almost nothing (bright_blue 2.5:1, blue 3.6:1, foreground 8.9:1).
lighter_background = "#bcd8f5"
dark_background = "#dbe7f2"
darker_background = "#bfd3e6"

# Blue-violet ink: text as the colour of a noon shadow, not brown.
# 11.6:1
foreground = "#2a2f4a"
# 4.2:1 on background, 3.8:1 on dark_background; dimmed text and comments. Darkened a step on
# 2026-09-07 from #7b7f96 so sizes and dates in the Files list clear the sky surface.
dark_foreground = "#6e7288"
# 7.5:1, secondary text
light_foreground = "#474c66"
# cursor and bright white, same as foreground in a light theme
bright_foreground = "#2a2f4a"

# Terminal colours: cleaner and more saturated than round 1, kept at or above 4.5:1.
# coral rust, 4.7:1
red = "#c43a2a"
# sun-gold, as saturated as 4.5:1 allows, 4.6:1
yellow = "#8f6600"
# sun-warmed rock, 4.7:1
orange = "#b44b1a"
# clean sage, 4.7:1
green = "#46782b"
# turquoise, 4.7:1
cyan = "#157682"
# cerulean, the accent as text, 4.6:1
blue = "#2470b0"
# violet of the far mountains, 4.6:1
magenta = "#8a5a9e"
# dry wood, 6.1:1
brown = "#7a5230"

# Bright variants: the same hues lifted and more saturated, so bold and bright terminal text
# visibly differs from normal. They sit at about 3.2 to 3.5:1 against background, below the 4.5:1
# body-text line but readable; Korrin chose visibility over the extra contrast (2026-09-06).
bright_red = "#e8452f"
bright_yellow = "#a67a00"
bright_green = "#56942f"
bright_cyan = "#1c94a2"
bright_blue = "#2f8ad6"
bright_magenta = "#a86dbd"
